services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aidr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aidr
      POSTGRES_USER: aidr
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: